[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rune-rag"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    # Core
    "openai>=1.30",
    "pinecone>=5.0",
    # LangChain / LangGraph
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langgraph>=0.1",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=1.8",
    # Config
    "pydantic-settings>=2.3",
    # Re-ranking
    "cohere>=5.5",
    # Web fallback
    "tavily-python>=0.3",
    # Sparse search
    "rank-bm25>=0.2",
    # HTML parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.32",
    # Chunking / embeddings
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "tiktoken>=0.7",
    # Env
    "python-dotenv>=1.0",
    # Evaluation (optional but included)
    "ragas>=0.1",
    "datasets>=2.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.ruff]
line-length = 100
