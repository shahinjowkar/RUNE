services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional: Redis for production-grade semantic cache
  # Uncomment and set REDIS_URL=redis://redis:6379 in .env to enable
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
